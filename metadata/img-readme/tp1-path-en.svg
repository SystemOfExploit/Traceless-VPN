  <text x="68" y="146" fill="#A1A1A1" font-family="Inter, Segoe UI, sans-serif" font-size="13">TP1, up to 8 s</text>

  <path d="M274 128 H330" stroke="#525252" stroke-width="2"/>
  <path d="M322 122 L334 128 L322 134" stroke="#525252" stroke-width="2" fill="none"/>

