<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" fill="none">
  <rect width="1100" height="640" rx="28" fill="#101010"/>
  <text x="48" y="64" fill="#FAFAFA" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="500">TP1 и AWG</text>
  <text x="48" y="98" fill="#A1A1A1" font-family="Inter, Segoe UI, sans-serif" font-size="16">Один шифр WireGuard. Разный профиль маскировки и ключей.</text>

  <rect x="48" y="132" width="488" height="360" rx="20" fill="#181818" stroke="#3F3F3F"/>
  <rect x="564" y="132" width="488" height="360" rx="20" fill="#181818" stroke="#E4E4E4"/>
  <text x="76" y="176" fill="#A1A1A1" font-family="Inter, Segoe UI, sans-serif" font-size="14">AWG</text>
  <text x="592" y="176" fill="#FAFAFA" font-family="Inter, Segoe UI, sans-serif" font-size="14">TP1</text>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="16">
    <text x="76" y="224" fill="#868686">Заголовки</text>
    <text x="76" y="252" fill="#E4E4E4">1, 2, 3, 4 у всех серверов</text>
    <text x="76" y="292" fill="#868686">Сигнатура</text>
    <text x="76" y="320" fill="#E4E4E4">Общий шаблон, его уже знают</text>
    <text x="76" y="360" fill="#868686">PSK</text>
    <text x="76" y="388" fill="#E4E4E4">Один ключ на весь сервер</text>
    <text x="76" y="428" fill="#868686">Если UDP закрыт</text>
    <text x="76" y="456" fill="#E4E4E4">Соединение не поднимается</text>

    <text x="592" y="224" fill="#868686">Заголовки</text>
    <text x="592" y="252" fill="#FAFAFA">Свои диапазоны на каждый сервер</text>
    <text x="592" y="292" fill="#868686">Сигнатура</text>
    <text x="592" y="320" fill="#FAFAFA">40 случайных байт, каждый раз новые</text>
    <text x="592" y="360" fill="#868686">PSK</text>
    <text x="592" y="388" fill="#FAFAFA">Отдельный ключ каждому клиенту</text>
    <text x="592" y="428" fill="#868686">Если UDP закрыт</text>
    <text x="592" y="456" fill="#FAFAFA">Через 8 с переход на REALITY TCP</text>
  </g>

  <rect x="48" y="516" width="1004" height="76" rx="18" fill="#181818" stroke="#3F3F3F"/>
  <text x="76" y="548" fill="#FAFAFA" font-family="Inter, Segoe UI, sans-serif" font-size="16">Шифр одинаковый: Curve25519 и ChaCha20-Poly1305</text>
  <text x="76" y="572" fill="#A1A1A1" font-family="Inter, Segoe UI, sans-serif" font-size="14">TP1 быстрее возвращает канал, хуже узнаётся фильтром и не делит PSK между клиентами.</text>
</svg>
